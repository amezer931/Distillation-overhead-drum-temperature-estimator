name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk BubblePointTemperature.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BubblePointTemperature-apk
          path: BubblePointTemperature.apk
      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5
          name: Bubble point temperature calculation v1.5
          body: |
            Bubble point temperature calculation for Android (5.0 and newer).
            Developer: Process engineer Ahmed Mezer.
            Download BubblePointTemperature.apk below and open it on the phone to install.
          files: BubblePointTemperature.apk
